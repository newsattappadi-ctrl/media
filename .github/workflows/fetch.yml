name: Fetch image
on:
  push:
    paths: ['inbox/*.url']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download every inbox URL into assets/
        run: |
          mkdir -p assets
          for f in inbox/*.url; do
            [ -e "$f" ] || continue
            name=$(basename "$f" .url)
            url=$(head -n 1 "$f" | tr -d '\r\n')
            case "$url" in https://*) ;; *) echo "skip $f"; continue;; esac
            curl -fsSL --max-time 120 --max-filesize 20000000 -o "assets/$name" "$url" && git rm -q -f "$f" || echo "failed $f"
          done
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A assets inbox
          git diff --cached --quiet || git commit -m "Fetch images into assets"
          git push
